name: Regenerate Calculator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate calculator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/regenerate_calculator.py

      - name: Commit and push if changed
        run: |
          git config user.name "CalcBlueprint Bot"
          git config user.email "bot@calcblueprint.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Regenerate calculator $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
