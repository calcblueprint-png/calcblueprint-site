name: Generate Calculator

on:
  schedule:
    # Runs every day at 02:00 UTC (09:00 Bangkok time)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate calculator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_calculator.py

      - name: Commit and push if changed
        run: |
          git config user.name "CalcBlueprint Bot"
          git config user.email "bot@calcblueprint.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Auto-generate calculator $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
