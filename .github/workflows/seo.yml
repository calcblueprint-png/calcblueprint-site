name: SEO Audit

on:
  push:
    branches: [main, master]
    paths:
      - "**.html"
      - "scripts/seo_*.py"
      - ".github/workflows/seo.yml"
  pull_request:
    paths:
      - "**.html"
  workflow_dispatch:
    inputs:
      mode:
        description: "lint = validate only; patch = auto-fix then validate"
        required: true
        default: "lint"
        type: choice
        options:
          - lint
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    if: github.event.inputs.mode != 'patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SEO lint
        id: lint
        run: |
          set +e
          python scripts/seo_lint.py --site-root . --json > seo-report.json
          echo "exit=$?" >> $GITHUB_OUTPUT
          python scripts/seo_lint.py --site-root . | tee seo-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: |
            seo-report.txt
            seo-report.json

      - name: Fail if lint found critical issues
        if: steps.lint.outputs.exit != '0'
        run: |
          echo "::error::SEO lint found critical issues. See seo-report.txt artifact."
          exit 1

  patch:
    if: github.event.inputs.mode == 'patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dry-run patch (show what would change)
        run: python scripts/seo_patch.py --site-root . --fix=all

      - name: Apply patch
        run: python scripts/seo_patch.py --site-root . --fix=all --write

      - name: Rewrite descriptions
        run: python scripts/seo_descriptions.py --site-root . --write

      - name: Re-lint after patch
        run: python scripts/seo_lint.py --site-root .

      - name: Commit and push if changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(seo): auto-patch missing OG tags, favicon, H1, nav anchors"
            git push
          else
            echo "No changes to commit."
          fi
