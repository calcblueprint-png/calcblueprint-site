name: Patch Social Meta Tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/patch_social_meta.py
        continue-on-error: true
      - run: |
          git config user.name "CalcBlueprint Bot"
          git config user.email "bot@calcblueprint.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Add social meta tags and favicon"
            git push
          fi
